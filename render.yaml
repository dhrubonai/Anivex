# Render Blueprint - Anivex
# Push this to GitHub and connect repo at https://dashboard.render.com
# Render will auto-detect this file and set up the service

services:
  - type: web
    name: anivex
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        generateValue: false
        value: "3000"
