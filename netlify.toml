# Anivex - Netlify Configuration
# Deploy: Connect GitHub repo or drag-drop the zip

[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

# API function route MUST come before the catch-all redirect
# Netlify processes redirects top-to-bottom, first match wins
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
